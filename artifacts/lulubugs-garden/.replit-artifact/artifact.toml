kind = "web"
previewPath = "/"
title = "Lulubug's Garden"
version = "1.0.0"
id = "artifacts/lulubugs-garden"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20003

[services.development]
run = "pnpm --filter @workspace/lulubugs-garden run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lulubugs-garden", "run", "build" ]
serve = "static"
publicDir = "artifacts/lulubugs-garden/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20003"
BASE_PATH = "/"
