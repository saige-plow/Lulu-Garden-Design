kind = "web"
previewPath = "/classic/"
title = "Lulubug's Garden (Classic)"
version = "1.0.0"
id = "artifacts/lulubugs-garden-classic"
router = "path"

[[services]]
name = "web"
paths = [ "/classic/" ]
localPort = 21429

[services.development]
run = "pnpm --filter @workspace/lulubugs-garden-classic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lulubugs-garden-classic", "run", "build" ]
serve = "static"
publicDir = "artifacts/lulubugs-garden-classic/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21429"
BASE_PATH = "/classic/"
