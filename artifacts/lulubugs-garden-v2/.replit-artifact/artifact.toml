kind = "web"
previewPath = "/lulubugs-garden-v2/"
title = "Lulubug's Garden (Staged)"
version = "1.0.0"
id = "artifacts/lulubugs-garden-v2"
router = "path"

[[services]]
name = "web"
paths = [ "/lulubugs-garden-v2/" ]
localPort = 21209

[services.development]
run = "pnpm --filter @workspace/lulubugs-garden-v2 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lulubugs-garden-v2", "run", "build" ]
serve = "static"
publicDir = "artifacts/lulubugs-garden-v2/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21209"
BASE_PATH = "/lulubugs-garden-v2/"
